<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Game Futsal{% endblock %}</title>
  {# ── Google Fonts: non-blocking load ──────────────────────────────────────
     Load with media="print" so the browser fetches it without blocking render,
     then onload flips it to media="all" to apply the styles. The <noscript>
     fallback covers JS-disabled environments. #}
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  </noscript>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=12">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div id="toast-container"></div>
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='app.js') }}?v=6"></script>
  <script>
    /* Auto-dismiss flash messages after 4 s */
    (function () {
      function dismissFlashes() {
        document.querySelectorAll(".flash").forEach(function (el) {
          setTimeout(function () {
            el.classList.add("flash--hide");
            setTimeout(function () { el.remove(); }, 400);
          }, 4000);
        });
      }
      /* Script is at end of <body> so DOM is ready — run immediately.
         DOMContentLoaded may have already fired at this point. */
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", dismissFlashes);
      } else {
        dismissFlashes();
      }
    })();
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
