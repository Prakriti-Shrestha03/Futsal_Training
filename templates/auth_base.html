{% extends "base.html" %}
{% block content %}
<div class="auth">
  <div class="auth__card">
    <div class="auth__brand">
      <img src="{{ url_for('static', filename='logo2.jpeg') }}" alt="The Game Futsal" class="auth__logo">
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash--{{ category or 'success' }}" id="flash-msg">{{ message }}</div>
        {% endfor %}
        <script>
          (function () {
            const el = document.getElementById("flash-msg");
            if (el) {
              setTimeout(() => {
                el.classList.add("flash--hide");
                setTimeout(() => el.remove(), 400);
              }, 3000);
            }
          })();
        </script>
      {% endif %}
    {% endwith %}

    {% block auth_form %}{% endblock %}
  </div>
</div>
{% endblock %}
